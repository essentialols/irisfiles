<h1>IrisFiles MCP App</h1>
<p>This is the connector endpoint for using <a href="https://irisfiles.com">IrisFiles</a> inside Claude, ChatGPT and other MCP Apps hosts.</p>
<p>Add <code id="u">/mcp</code> on this domain as a custom connector. Files are converted inside the chat on your device; this server never receives them.</p>
<script>document.getElementById('u').textContent = location.origin + '/mcp';</script>
